name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same ref cancels the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cxx }} / ${{ matrix.mkl == 'ON' && 'MKL' || matrix.lapack }}${{ matrix.interface == 'ilp64' && ' (ilp64)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        # The tests validate against a real LAPACKE + CBLAS: MKL's own with
        # the MKL extension, OpenBLAS or Netlib's reference LAPACK without it
        # (cmake/FindLAPACKE.cmake; -DCBK_TEST_LAPACK pins the stack, so a
        # job cannot silently pick up the other one through Debian's
        # update-alternatives symlinks).
        mkl: ["ON", "OFF"]
        lapack: [openblas, netlib]
        interface: [lp64]
        exclude:
          - { mkl: "ON", lapack: netlib }
        include:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
          # MKL's 64-bit integer interface: MKL_INT is part of the MKL-style
          # API's ABI, so the wrappers and their suites must build and pass
          # against it too (libmkl-dev ships both interface layers). The
          # LAPACKE the suites call is MKL's, at the same interface.
          - { cc: gcc,   cxx: g++, mkl: "ON", lapack: openblas, interface: ilp64 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # libmkl-dev supplies the Compact extension and MKL's LAPACK/LAPACKE, so
      # the MKL-backed suites validate against real MKL + LAPACK, and the
      # portable suites against MKL's LAPACKE.
      - name: Install Intel MKL
        if: matrix.mkl == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmkl-dev

      # Without MKL the suites need a LAPACKE stack: OpenBLAS (Debian ships
      # its LAPACKE as Netlib's liblapacke, hence both packages), or Netlib's
      # reference LAPACK/BLAS with its LAPACKE.
      - name: Install OpenBLAS
        if: matrix.mkl == 'OFF' && matrix.lapack == 'openblas'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev liblapacke-dev

      - name: Install Netlib LAPACK
        if: matrix.mkl == 'OFF' && matrix.lapack == 'netlib'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblapacke-dev liblapack-dev libblas-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCBK_WITH_MKL=${{ matrix.mkl }}
          -DCBK_TEST_LAPACK=${{ matrix.mkl == 'ON' && 'mkl' || matrix.lapack }}
          -DMKLCompact_INTERFACE=${{ matrix.interface }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure
