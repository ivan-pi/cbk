name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on the same ref cancels the in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.cxx }} / MKL ${{ matrix.mkl }}${{ matrix.interface == 'ilp64' && ' (ilp64)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        mkl: ["ON", "OFF"]
        interface: [lp64]
        include:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
          # MKL's 64-bit integer interface: MKL_INT is part of the MKL-style
          # API's ABI, so the wrappers and their suites must build and pass
          # against it too (libmkl-dev ships both interface layers).
          - { cc: gcc,   cxx: g++, mkl: "ON", interface: ilp64 }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      # libmkl-dev supplies the Compact extension and MKL's LAPACK/LAPACKE, so
      # the MKL-backed suites validate against real MKL + LAPACK. The portable
      # (MKL OFF) build needs nothing beyond the C++17 toolchain the image
      # ships; OpenBLAS is only the per-matrix baseline of the portable C
      # API's benchmarks (-DCBK_BUILD_BENCHMARKS=ON), so that their
      # integration tests run in this configuration too.
      - name: Install Intel MKL
        if: matrix.mkl == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmkl-dev

      - name: Install OpenBLAS
        if: matrix.mkl == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenblas-dev

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCBK_WITH_MKL=${{ matrix.mkl }}
          -DCBK_BUILD_BENCHMARKS=ON
          -DBLA_VENDOR=${{ matrix.mkl == 'OFF' && 'OpenBLAS' || 'All' }}
          -DMKLCompact_INTERFACE=${{ matrix.interface }}

      - name: Build
        run: cmake --build build -j

      # OpenBLAS threads internally; the benchmarks drive it from their own
      # OpenMP loop, so pin it to one thread as their header says to.
      - name: Test
        env:
          OPENBLAS_NUM_THREADS: 1
        run: ctest --test-dir build --output-on-failure
