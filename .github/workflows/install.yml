name: Install

# The install target: configure, build and `cmake --install` into a scratch
# prefix, static and shared, then .github/check_install.sh verifies the
# tree (the library and the headers of what was built, the MKL headers only
# with CBK_WITH_MKL=ON) and builds a downstream project against it with
# find_package(cbk). One job per MKL setting, so MKL is installed once.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: MKL ${{ matrix.mkl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mkl: ["ON", "OFF"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Intel MKL
        if: matrix.mkl == 'ON'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmkl-dev

      - name: Build, install and check (static and shared)
        run: |
          for shared in OFF ON; do
            cmake -S . -B "build-$shared" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCBK_WITH_MKL=${{ matrix.mkl }} \
              -DBUILD_SHARED_LIBS="$shared" \
              -DCBK_BUILD_TESTS=OFF
            cmake --build "build-$shared" -j
            cmake --install "build-$shared" --prefix "$RUNNER_TEMP/prefix-$shared"
            CBK_CONSUMER_BUILD_DIR="$RUNNER_TEMP/consumer-$shared" \
              .github/check_install.sh "$RUNNER_TEMP/prefix-$shared" \
              ${{ matrix.mkl }} "$shared"
          done
